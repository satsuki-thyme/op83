<text x="887" y="856" class="n" >正門（王都から）</text>
<text x="703" y="605" class="n" >内郭門</text>
<text x="590" y="264" class="sub" text-anchor="middle">内郭：王族・謁見の中心</text>
<text x="600" y="870" class="sub" text-anchor="middle">外郭：守備・厨房・宿泊・輸送</text>
<rect x="1100" y="152" width="358" height="755" rx="14" fill="#fffdf8" stroke="#c5bead" stroke-width="2"/>
<text x="1125" y="202" class="h" style="font-size:27px">動線と権限</text>
<text x="1128" y="252" class="t" style="font-size:18px;font-weight:700">1. 正門から外郭へ</text>
<text x="1130" y="279" class="sm" >門衛による人物・荷物確認</text>
<text x="1128" y="334" class="t" style="font-size:18px;font-weight:700">2. 外郭の生活機能</text>
<text x="1130" y="361" class="sm" >兵士・厨房・使節の滞在</text>
<text x="1128" y="416" class="t" style="font-size:18px;font-weight:700">3. 内郭門で再検問</text>
<text x="1130" y="443" class="sm" >招かれた者のみ通行</text>
<text x="1128" y="498" class="t" style="font-size:18px;font-weight:700">4. 大広間で公的謁見</text>
<text x="1130" y="525" class="sm" >公的儀礼・宴会・裁定</text>
<text x="1128" y="580" class="t" style="font-size:18px;font-weight:700">5. 奥の王族居館</text>
<text x="1130" y="607" class="sm" >最も私的な区域</text>
<text x="1128" y="663" class="t" style="font-size:18px;font-weight:700">6. 文書庫・政務官</text>
<text x="1130" y="690" class="sm" >印璽・財務・記録を管理</text>
<path d="M1126 732 H1432" stroke="#d5c7b6" stroke-width="2"/>
<text x="1130" y="770" class="t" style="font-size:18px;font-weight:700">守備と居住を分離</text>
<text x="1130" y="806" class="sm" >王の私室に至るまで</text>
<text x="1130" y="832" class="sm" >門・中庭・侍従の関門を</text>
<text x="1130" y="858" class="sm" >段階的に通る設計。</text>
