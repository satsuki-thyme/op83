- attributes legend: 
  collE:
    full name: collective entity
    description: |
      集合的実体。集団、団体。国や町、組織、仲間内、など個人の集まり全般。
  place:
    full name: place
    description: |
      地理的な場所。国や町などの地理的な場所としての側面。
  locat:
    full name: location
    description: |
      シーンが展開される場所。
  event:
    full name: event
    description: |
      出来事。
  subje:
    full name: subject
    description: |
      主体。植物を含む生物、または精神を持った存在。物や物品。物語的に主体として語らせることのできるもののなかでmonst以外の存在。
  monst:
    full name: monster
    description: |
      魔物。物語的にキャラクターとして分類されない敵性の存在。
  other:
    full name: others
    description: |
      その他の物事。











