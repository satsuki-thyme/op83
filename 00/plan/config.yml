motif:
  contents: 魔法屋
  idea:
    - 魔法屋で魔法関連のアイテムも売っているとすれば魔導具屋や魔法薬屋と同じように魔物を狩りに出かけることも可能だ。なんなら魔導書を作るのに魔物の素材が必要なんて設定もいいかもしれない。

protagonist:
  ドラゴンとエルフのハーフ。子ができないはずの交配にできた子。どちらの特徴も表面的には相殺して現れていない。なので普通の人に見える。年齢5万3678歳。見た目は20歳の男性。見目麗し。細マッチョ。性格は穏やか。好奇心旺盛。今は世界中を何度も旅した果に王都で魔法薬屋をしている。

point of view:
  一人称視点

theme:
  contents: 自由に生きる
  gist:
    - 思うままに生きたいという欲求をテーマに持ってきたらいいのかもしれない。一人称視点だし僕の願望を叶えてもらおうか。願望を書くのは恥ずかしいけどこれは挑戦だな。

predicament:
  - 是かつ非
  - 是と非がグラデーションでつながっていて分かちがたい
  - 是と是の対立
  - 非と非の対立

story core:
  - 主人公は長年店を開いていて王国の建国より早いとかにしておこう。それでたいへんな効能の魔法薬を作っているし最強だし、王国から秘密裏に接触がある。そこで問題に巻き込まれる。
  - やむない事情で助けた人が実は暗殺されたはずの重要人物で騒動に巻き込まれる。
  - 店から巣立ったかつての弟子の困窮を知って介入する。
  - 希少性の高い魔法薬を売ったがそれが原因で揉めはじめた権力者のあいだに介入する。